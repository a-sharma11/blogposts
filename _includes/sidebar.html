<aside class="w-[280px] flex-shrink-0 sticky top-[calc(22px*2+60px)] max-h-[calc(100vh-120px)] overflow-y-auto sidebar hidden lg:block" role="complementary">
  <div class="bg-bg border border-hairline rounded-[10px] p-[14px]">
    <h3 class="text-base font-bold text-text m-0 mb-[10px] pb-[10px] border-b border-hairline">Categories</h3>
    <nav class="flex flex-wrap gap-y-[10px] gap-x-[14px]">
      {% assign categories = site.posts | map: "categories" | flatten | uniq | sort %}
      {% for category in categories %}
        {% assign category_posts = site.posts | where_exp: "post", "post.categories contains category" %}
        <a href="{{ '/' | relative_url }}{{ category }}.html" class="inline-block px-[10px] py-[6px] border border-hairline rounded-[6px] bg-bg text-text font-medium text-[0.9375rem] no-underline transition-all hover:bg-soft hover:no-underline">
          {{ category | capitalize }} ({{ category_posts.size }})
        </a>
      {% endfor %}
    </nav>
  </div>
</aside>

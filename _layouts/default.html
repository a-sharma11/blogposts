<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | default: 'A collection of blog posts' }}">
    <meta name="author" content="{{ site.author }}">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    
    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230066cc'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial'>B</text></svg>">
    
    {% if jekyll.environment == 'production' and site.google_analytics %}
    {% include google-analytics.html %}
    {% endif %}
  </head>
  <body>
    <header class="bg-bg border-b border-hairline py-[14px] lg:py-[22px] sticky top-0 z-[100]" role="banner">
      <div class="max-w-[860px] mx-auto px-[14px] lg:px-[22px]">
        <div class="flex flex-col items-center">
          <a class="text-2xl font-bold text-text m-0 tracking-[-0.01em] transition-colors hover:text-link hover:no-underline" href="{{ '/' | relative_url }}" aria-label="Home">{{ site.title }}</a>
          <nav class="flex gap-y-[10px] gap-x-[14px] items-center flex-wrap mt-[10px]">
            <a href="{{ '/' | relative_url }}" class="text-text font-medium px-[10px] py-[6px] border border-hairline rounded-full bg-bg text-[0.9375rem] transition-all hover:bg-soft hover:no-underline">Home</a>
            <a href="{{ '/about' | relative_url }}" class="text-text font-medium px-[10px] py-[6px] border border-hairline rounded-full bg-bg text-[0.9375rem] transition-all hover:bg-soft hover:no-underline">About</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="min-h-[calc(100vh-200px)] py-[26px] lg:py-[40px] bg-bg" aria-label="Content">
      <div class="max-w-[860px] mx-auto px-[14px] lg:px-[22px]">
        {{ content }}
      </div>
    </main>

    <footer class="bg-bg text-muted py-[18px] lg:py-[22px] mt-[26px] lg:mt-[40px] border-t border-hairline" role="contentinfo">
      <div class="max-w-[860px] mx-auto px-[14px] lg:px-[22px] text-center">
        <p class="m-0 text-muted text-[13px]">&copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }}. All rights reserved.</p>
        {% if site.email %}
        <p class="mt-2 text-[13px]">
          <a href="mailto:{{ site.email }}" class="text-link">Contact</a>
        </p>
        {% endif %}
      </div>
    </footer>
  </body>
</html>

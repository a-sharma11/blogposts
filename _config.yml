# Site settings
title: My Blog
description: A collection of blog posts
author: Your Name
email: your.email@example.com
url: "" # Leave empty for GitHub Pages, or set to your custom domain
baseurl: "" # Leave empty if repository name is username.github.io, otherwise use "/repository-name"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/


# Site settings
title: Distributed thoughts on everything software
description: Distributed thoughts on everything software
author: Ashish Sharma
email: a-sharma@outlook.com
url: "" # Leave empty for GitHub Pages, or set to your custom domain
baseurl: "" # Leave empty if repository name is username.github.io, otherwise use "/repository-name"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

